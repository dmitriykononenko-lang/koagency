<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ko:agency — слайдер-награда</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#E60000;--ink:#101010;--mut:#666}
  *{margin:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eee;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:24px}
  .card{position:relative;width:100%;max-width:340px;overflow:hidden;border-radius:18px;border:1px solid rgba(0,0,0,.1);background:#fff;padding:24px;box-shadow:0 10px 30px -12px rgba(0,0,0,.2);text-align:center}
  .gift{width:80px;height:80px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .gift svg{width:40px;height:40px;color:var(--red)}
  h3{font-size:20px;font-weight:700;color:var(--ink)} .sub{margin-top:8px;font-size:14px;color:var(--mut)}
  .slider{position:relative;height:56px;width:100%;border-radius:999px;background:#f0f0f0;margin-top:24px;overflow:hidden}
  .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;
    background:linear-gradient(110deg,#9ca3af,45%,#101010,55%,#9ca3af);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.5s linear infinite;pointer-events:none;padding:0 56px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .handle{position:absolute;left:0;top:0;height:56px;width:56px;border-radius:999px;background:var(--red);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:2;touch-action:none}
  .handle svg{width:24px;height:24px;color:#fff}
  .reward{margin-top:24px;display:none;align-items:center;justify-content:space-between;height:56px;border-radius:999px;background:var(--red);color:#fff;padding:8px;text-decoration:none}
  .reward.show{display:flex}
  .reward .l{padding-left:12px;text-align:left} .reward .l b{font-size:14px} .reward .l p{font-size:12px;opacity:.8}
  .reward .ic{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center} .reward .ic svg{width:20px;height:20px;color:var(--red)}
  .hint{margin-top:14px;font-size:12px;color:#999}
</style></head>
<body>
<div class="card">
  <div class="gift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 12v8"/><path d="M19 12v8H5v-8"/><path d="M19 8a4 4 0 0 0-8 0"/><path d="M5 8a4 4 0 0 1 8 0"/></svg></div>
  <h3>Заявка отправлена!</h3>
  <p class="sub">Мы свяжемся с вами в ближайшее время. А пока — заберите бонус ниже.</p>
  <div class="slider" id="slider">
    <span class="txt">Свайпни и забери бонус</span>
    <div class="handle" id="handle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
  </div>
  <a class="reward" id="reward" href="#"><div class="l"><b>Бесплатный аудит CRM</b><p>Нажмите, чтобы забрать</p></div><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 12v8"/><path d="M19 12v8H5v-8"/><path d="M19 8a4 4 0 0 0-8 0"/><path d="M5 8a4 4 0 0 1 8 0"/></svg></div></a>
  <div class="hint" id="hint">↑ потяни ползунок вправо</div>
</div>
<script>
  const slider=document.getElementById('slider'),handle=document.getElementById('handle'),reward=document.getElementById('reward'),hint=document.getElementById('hint');
  let drag=false,startX=0,cur=0,max=0;
  function setMax(){max=slider.offsetWidth-handle.offsetWidth;}
  setMax(); window.addEventListener('resize',setMax);
  function down(x){drag=true;startX=x-cur;handle.style.cursor='grabbing';}
  function move(x){if(!drag)return;cur=Math.max(0,Math.min(max,x-startX));handle.style.transform='translateX('+cur+'px)';}
  function up(){if(!drag)return;drag=false;handle.style.cursor='grab';
    if(cur>max*0.8){handle.style.transition='transform .2s';handle.style.transform='translateX('+max+'px)';
      slider.style.display='none';reward.classList.add('show');hint.textContent='Бонус активирован!';}
    else{handle.style.transition='transform .2s';handle.style.transform='translateX(0)';cur=0;setTimeout(()=>handle.style.transition='',200);}}
  handle.addEventListener('mousedown',e=>down(e.clientX));
  window.addEventListener('mousemove',e=>move(e.clientX));
  window.addEventListener('mouseup',up);
  handle.addEventListener('touchstart',e=>down(e.touches[0].clientX),{passive:true});
  window.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
  window.addEventListener('touchend',up);
</script>
</body></html>
